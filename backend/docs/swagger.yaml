  /penduduk/update/{nik}:
    put:
      consumes:
      - application/json
      parameters:
      - description: NIK penduduk yang akan di-update
        in: path
        name: nik
        required: true
        type: string
      - description: Data update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PendudukUpdateRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
