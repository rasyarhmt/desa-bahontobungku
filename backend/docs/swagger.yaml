          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Toggle status template (aktif/nonaktif)
      tags:
