  /surat-template:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.SuratTemplateResponseDTO'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get all template surat
      tags:
      - surat-template
    post:
      consumes:
      - multipart/form-data
      description: 'Upload file template HTML (.html) form-data multipart: field file_template,
        kode, nama_template, deskripsi, status. File dienkripsi menjadi .html.enc'
      parameters:
      - description: File template HTML
        in: formData
        name: file_template
        required: true
        type: file
      - description: Kode unik template
        example: SK_DOMISILI
        in: formData
        name: kode
        required: true
        type: string
      - description: Nama template
        example: '"Surat Keterangan Domisili"'
        in: formData
        name: nama_template
        required: true
        type: string
      - description: Deskripsi template
        in: formData
        name: deskripsi
        type: string
      - description: aktif / nonaktif
        example: aktif
        in: formData
        name: status
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Tambah template surat baru
      tags:
      - surat-template
  /surat-template/{id}:
    delete:
      parameters:
      - description: ID template
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Hapus template surat
      tags:
      - surat-template
    get:
      parameters:
      - description: ID template
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.SuratTemplateResponseDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get template surat by id
      tags:
      - surat-template
    put:
      consumes:
      - multipart/form-data
      description: Upload multipart, file_template opsional. Jika tidak diupload,
        file lama dipertahankan
      parameters:
      - description: ID template
        in: path
        name: id
        required: true
        type: integer
      - description: Kode unik template
        example: SK_DOMISILI
        in: formData
        name: kode
        required: true
        type: string
      - description: File template HTML (opsional)
        in: formData
        name: file_template
        type: file
      - description: Nama template
        example: '"Surat Keterangan Domisili"'
        in: formData
        name: nama_template
        type: string
      - description: Deskripsi template
        in: formData
        name: deskripsi
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Update template surat
      tags:
      - surat-template
  /surat-template/{id}/toggle-status:
    put:
      parameters:
      - description: ID template
        in: path
        name: id
        required: true
        type: integer
      produces:
