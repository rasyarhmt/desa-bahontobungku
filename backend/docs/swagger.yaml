              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      summary: Statistik agama
      tags:
      - stats
  /penduduk/stats/kepala-keluarga:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.StatCountDTO'
