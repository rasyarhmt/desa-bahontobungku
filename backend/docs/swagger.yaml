        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get aparatur by NIP
      tags:
      - aparatur
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
