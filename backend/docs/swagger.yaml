host: localhost:8080
info:
  contact: {}
  description: Backend API Sistem Informasi Desa Bahontobungku
  title: Desa Bahontobungku API
  version: "1.0"
paths:
  /aparatur:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AparaturResponseDTO'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      summary: Get semua aparatur (urut struktur jabatan)
      tags:
      - aparatur
    post:
      consumes:
      - multipart/form-data
      description: 'Upload foto via form-data multipart (opsional): field foto, nama,
        nip, jabatan, telepon. Foto disimpan polos di uploads/aparatur'
      parameters:
      - description: Foto aparatur (jpg/png/webp, maks 5MB)
        in: formData
        name: foto
        type: file
      - description: Nama aparatur
        in: formData
        name: nama
        required: true
        type: string
      - description: NIP
        in: formData
        name: nip
        type: string
      - description: Jabatan
        in: formData
        name: jabatan
        required: true
        type: string
      - description: Nomor telepon
        in: formData
        name: telepon
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AparaturResponseDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Tambah aparatur desa
      tags:
      - aparatur
  /aparatur/{id}:
    delete:
      parameters:
      - description: ID aparatur
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Hapus aparatur
      tags:
      - aparatur
    get:
      parameters:
      - description: ID aparatur
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AparaturResponseDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get aparatur by id
      tags:
      - aparatur
    put:
      consumes:
      - multipart/form-data
      description: Upload multipart; foto opsional (jika diupload, foto lama diganti)
      parameters:
      - description: ID aparatur
        in: path
        name: id
        required: true
        type: integer
      - description: Foto aparatur (opsional)
        in: formData
        name: foto
        type: file
      - description: Nama aparatur
        in: formData
        name: nama
        type: string
      - description: NIP
        in: formData
        name: nip
        type: string
      - description: Jabatan
        in: formData
        name: jabatan
        type: string
      - description: Nomor telepon
        in: formData
        name: telepon
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Update aparatur
      tags:
      - aparatur
  /aparatur/nip/{nip}:
    get:
      parameters:
      - description: NIP aparatur
        in: path
        name: nip
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
