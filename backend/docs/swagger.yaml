            $ref: '#/definitions/domain.HttpResponse'
      summary: Total laki-laki
      tags:
      - stats
  /penduduk/stats/perempuan:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.StatCountDTO'
