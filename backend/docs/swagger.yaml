        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Hapus penduduk
      tags:
      - penduduk
  /penduduk/kepala-keluarga:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.PendudukResponseDTO'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get all kepala keluarga
      tags:
      - penduduk
  /penduduk/nik/{nik}:
    get:
      parameters:
      - description: NIK penduduk
        in: path
        name: nik
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.PendudukResponseDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Cari penduduk by NIK
      tags:
      - penduduk
  /penduduk/stats/agama:
    get:
